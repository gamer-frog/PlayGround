<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b3327}
</style></head><body>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14532d"/><stop offset="0.55" stop-color="#0d3b2e"/><stop offset="1" stop-color="#07271c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">

    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.35"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="248" r="210" fill="url(#halo)"/>
  <!-- isometric floor diamond -->
  <g opacity="0.95">
    <path d="M256 356 L412 286 L256 216 L100 286 Z" fill="#0f4a34" stroke="#34d399" stroke-width="6" stroke-linejoin="round"/>
    <path d="M256 356 L412 286 L412 300 L256 370 L100 300 L100 286 Z" fill="#14532d" stroke="#34d399" stroke-width="6" stroke-linejoin="round"/>

    <path d="M217 309 L256 292 L295 309 L256 326 Z" fill="none" stroke="#86efac" stroke-width="4" opacity="0.35"/>
  </g>
  <!-- hydroponic rack silhouette -->
  <g>
    <rect x="186" y="168" width="14" height="112" rx="6" fill="#e8f7ee"/>
    <rect x="312" y="168" width="14" height="112" rx="6" fill="#e8f7ee"/>
    <rect x="156" y="252" width="200" height="16" rx="8" fill="#f0fdf4"/>
    <rect x="168" y="192" width="176" height="12" rx="6" fill="#f0fdf4" opacity="0.85"/>

    <g>
      <ellipse cx="198" cy="180" rx="30" ry="21" fill="url(#leaf)" transform="rotate(-24 198 180)"/>
      <ellipse cx="244" cy="168" rx="34" ry="23" fill="url(#leaf)" transform="rotate(-8 244 168)"/>
      <ellipse cx="292" cy="172" rx="32" ry="22" fill="url(#leaf)" transform="rotate(12 292 172)"/>
      <ellipse cx="326" cy="188" rx="24" ry="17" fill="url(#leaf)" transform="rotate(30 326 188)"/>
      <path d="M245 200 Q252 176 262 158" stroke="#166534" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M276 202 Q284 180 298 164" stroke="#166534" stroke-width="7" fill="none" stroke-linecap="round"/>
    </g>
    <!-- water drop -->
    <path d="M256 118 C256 118 230 152 230 170 a26 26 0 0 0 52 0 C282 152 256 118 256 118 Z" fill="#38bdf8" opacity="0.95"/>
    <path d="M248 165 a11 11 0 0 0 8 16" stroke="#e0f2fe" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- sun -->
  <circle cx="396" cy="106" r="34" fill="#fbbf24"/>
  <g stroke="#fbbf24" stroke-width="10" stroke-linecap="round">
    <path d="M396 52 L396 36"/><path d="M396 176 L396 160"/><path d="M342 106 L326 106"/><path d="M466 106 L450 106"/>
    <path d="M358 68 L347 57"/><path d="M445 155 L434 144"/><path d="M434 68 L445 57"/><path d="M347 155 L358 144"/>
  </g>
  <!-- sparkles -->
  <g fill="#d9f99d" opacity="0.8">
    <circle cx="120" cy="140" r="7"/><circle cx="150" cy="106" r="5"/><circle cx="100" cy="196" r="5"/>
  </g>

</body></html>
